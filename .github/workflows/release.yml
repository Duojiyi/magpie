name: "Publish Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
            rustTargets: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles app,dmg'
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: install frontend dependencies
        run: npm install

      - name: extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if (-not (Test-Path CHANGELOG.md)) {
            "See CHANGELOG.md for details." | Out-File -FilePath release_notes.md -Encoding utf8 -NoNewline
            exit 0
          }
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $regex = "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $m = [regex]::Match($changelog, $regex)
          if (-not $m.Success) {
            $body = "See CHANGELOG.md for details."
          } else {
            $body = $m.Value.Trim()
          }
          $body | Out-File -FilePath release_notes.md -Encoding utf8 -NoNewline
          Write-Host "----- release notes -----"
          Write-Host $body

      - name: build & publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Magpie v__VERSION__"
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: update release body with CHANGELOG
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $body = Get-Content release_notes.md -Raw
          gh release edit "$tag" --notes "$body" --repo $env:GITHUB_REPOSITORY

      - name: build portable bundle
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npm run build:portable

      - name: upload portable bundle
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = Get-ChildItem -Path artifacts/portable -Filter '*.zip' | Select-Object -First 1
          if (-not $portable) { throw 'portable zip missing' }
          gh release upload "v$version" "$($portable.FullName)" --repo $env:GITHUB_REPOSITORY --clobber
