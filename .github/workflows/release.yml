name: "Build Release Bundles"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
            rustTargets: 'x86_64-pc-windows-msvc'
            artifactName: 'windows'
            uploadPaths: |
              src-tauri/target/release/bundle/nsis/*
              src-tauri/target/release/bundle/msi/*
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles app,dmg'
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            artifactName: 'macos-universal'
            uploadPaths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: install frontend dependencies
        run: npm install

      - name: build bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TERM_COLOR: never
          NO_COLOR: 1
        run: |
          $buildOutput = npm run tauri -- build ${{ matrix.args }} 2>&1 | Tee-Object -FilePath tauri-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $matches = Select-String -Path tauri-build.log -Pattern 'error|failed|cannot|could not|not found|No such|denied|Exit status|Command' -CaseSensitive:$false |
              Select-Object -First 60 |
              ForEach-Object { "$($_.LineNumber): $($_.Line)" }
            if ($matches) {
              $snippet = ($matches -join "`n")
            } else {
              $snippet = ($buildOutput | Select-Object -Last 80) -join "`n"
            }
            $escaped = $snippet -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Tauri build failed::$escaped"
            exit $exitCode
          }

      - name: upload tauri build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.artifactName }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magpie-${{ matrix.artifactName }}
          path: ${{ matrix.uploadPaths }}
          if-no-files-found: error

      - name: build portable bundle
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npm run build:portable

      - name: upload portable artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: magpie-windows-portable
          path: artifacts/portable/*.zip
          if-no-files-found: error
